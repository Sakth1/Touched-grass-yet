[tox]
requires = tox>=4
envlist = py312, lint, typecheck, compat
skip_missing_interpreters = true
min_version = 4.0

[testenv]
description = Run the test suite
deps =
    flet>=0.86.2
    pytest>=9.1
    pytest-asyncio>=0.25
commands =
    pytest tests/ -v --tb=short {posargs}

[testenv:lint]
description = Lint with ruff
deps = ruff>=0.16.0
commands =
    ruff check src/ tests/ {posargs}
    ruff format --check src/ tests/ {posargs}

[testenv:typecheck]
description = Static type checking with pyright
deps =
    pyright>=1.1.0
commands =
    pyright src/ tests/ {posargs}

[testenv:compat]
description = Check flet API snapshot against baseline
deps =
    flet>=0.86.2
commands =
    python scripts/check_flet_snapshot.py --snapshot {toxinidir}/api-snapshot.json
